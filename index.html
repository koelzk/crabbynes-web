<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>crabbyNES</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root { --pad-button: min(12vmin, 88px); }
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }

        /* The stage covers the whole page; the renderer letterboxes the NES picture inside it. */
        #stage { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
        #stage.fullscreen { background: #000; }
        #crabby { display: block; width: 100%; height: 100%; }
        #stage.dragover #crabby { outline: 4px dashed #667eea; outline-offset: -4px; }

        button {
            font: inherit; color: #eee; background: rgba(20, 20, 20, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover { background: rgba(60, 60, 60, 0.8); }
        button.active { border-color: #667eea; color: #fff; }
        button svg { width: 60%; height: 60%; fill: none; stroke: currentColor; stroke-width: 2;
                     stroke-linecap: round; stroke-linejoin: round; }

        /* Top menu, hidden until the top half of the stage is tapped. */
        #menu {
            position: absolute; top: 0; left: 0; right: 0; height: 64px; padding: 8px 12px;
            box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr;
            align-items: center; transition: opacity 0.2s;
        }
        #menu > .left { justify-self: start; }
        #menu > .center { justify-self: center; }
        #menu > .right { justify-self: end; }
        #menu button { width: 48px; height: 48px; }
        #stage.menu-hidden #menu { opacity: 0; pointer-events: none; }

        /* Virtual gamepad: d-pad left, B/A right, Select/Start centered at the bottom. */
        #pad {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 16px;
            box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr;
            align-items: end; pointer-events: none;
        }
        #stage.pad-hidden #pad { display: none; }
        #pad > * { pointer-events: auto; }
        .dpad { position: relative; width: calc(var(--pad-button) * 3); height: calc(var(--pad-button) * 3); justify-self: start; }
        .dpad .arrow { position: absolute; width: var(--pad-button); height: var(--pad-button); }
        .dpad .up    { left: var(--pad-button); top: 0; }
        .dpad .down  { left: var(--pad-button); bottom: 0; }
        .dpad .left  { left: 0; top: var(--pad-button); }
        .dpad .right { right: 0; top: var(--pad-button); }
        .dpad .arrow.active { background: rgba(102, 126, 234, 0.8); }
        .ab { justify-self: end; display: flex; gap: 16px; align-items: flex-end; }
        .ab button, .startsel button { width: var(--pad-button); height: var(--pad-button); border-radius: 50%; font-size: calc(var(--pad-button) * 0.35); font-weight: bold; }
        .ab button:first-child { margin-bottom: calc(var(--pad-button) * 0.4); }
        .startsel { justify-self: center; display: flex; gap: 12px; align-items: flex-end; }
        .startsel button { width: calc(var(--pad-button) * 0.7); height: calc(var(--pad-button) * 0.5); border-radius: 999px; font-size: calc(var(--pad-button) * 0.18); }
        .pad-button.active { background: rgba(102, 126, 234, 0.8); }

        #toast {
            position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #eee; padding: 8px 14px; border-radius: 8px;
            max-width: 90%; text-align: center; pointer-events: none; transition: opacity 0.3s;
        }
        #toast.hidden { opacity: 0; }
    </style>
</head>
<body>
<div id="stage" class="menu-hidden">
    <canvas id="crabby"></canvas>

    <div id="menu">
        <div class="left">
            <button id="openFile" type="button" aria-label="Open ROM file" title="Open ROM file">
                <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5 12 11l2.5 2.5"/></svg>
            </button>
        </div>
        <div class="center">
            <button id="padToggle" type="button" aria-label="Toggle virtual gamepad" title="Toggle virtual gamepad">
                <svg viewBox="0 0 24 24"><path d="M6 8h12a4 4 0 0 1 4 4v1a3 3 0 0 1-5.5 1.7L15.5 14h-7l-1 1.7A3 3 0 0 1 2 13v-1a4 4 0 0 1 4-4z"/><path d="M7 10v3M5.5 11.5h3"/><circle cx="16" cy="11" r="0.6"/><circle cx="18" cy="13" r="0.6"/></svg>
            </button>
        </div>
        <div class="right">
            <button id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Toggle fullscreen">
                <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
        </div>
    </div>

    <div id="pad">
        <div class="dpad">
            <button class="arrow up" data-btn="Up" type="button" aria-label="Up">▲</button>
            <button class="arrow left" data-btn="Left" type="button" aria-label="Left">◀</button>
            <button class="arrow right" data-btn="Right" type="button" aria-label="Right">▶</button>
            <button class="arrow down" data-btn="Down" type="button" aria-label="Down">▼</button>
        </div>
        <div class="startsel">
            <button class="pad-button" data-btn="Select" type="button">SELECT</button>
            <button class="pad-button" data-btn="Start" type="button">START</button>
        </div>
        <div class="ab">
            <button class="pad-button" data-btn="B" type="button" aria-label="B">B</button>
            <button class="pad-button" data-btn="A" type="button" aria-label="A">A</button>
        </div>
    </div>

    <div id="toast" class="hidden"></div>
</div>
<input type="file" id="romInput" hidden>

<script type="module">
    import init, { start, rom_file_accept, VirtualButton } from './pkg/crabby.js';

    const stage = document.getElementById('stage');
    const canvas = document.getElementById('crabby');
    const menu = document.getElementById('menu');
    const pad = document.getElementById('pad');
    const romInput = document.getElementById('romInput');
    const openFileButton = document.getElementById('openFile');
    const padToggle = document.getElementById('padToggle');
    const fullscreenButton = document.getElementById('fullscreen');
    const toast = document.getElementById('toast');

    const MENU_HIDE_DELAY_MS = 3000;
    const TOAST_DURATION_MS = 3000;

    let emulator = null;

    // ---- Toast -----------------------------------------------------------------------

    let toastTimer = null;
    function showToast(message) {
        toast.textContent = message;
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.add('hidden'), TOAST_DURATION_MS);
    }

    // ---- ROM loading -----------------------------------------------------------------

    async function loadRomFile(file) {
        if (!emulator) {
            showToast('Emulator is not ready yet');
            return;
        }
        const bytes = new Uint8Array(await file.arrayBuffer());
        emulator.load_rom(file.name, bytes);
        // The emulator reports parse errors on the canvas, not back to the page.
        showToast(`Loaded ${file.name}`);
    }

    openFileButton.addEventListener('click', () => romInput.click());
    romInput.addEventListener('change', () => {
        const file = romInput.files[0];
        romInput.value = ''; // allow picking the same file again
        if (file) loadRomFile(file);
    });

    // winit does not report dropped files on the web, so the page handles drag & drop.
    stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('dragover'); });
    stage.addEventListener('dragleave', () => stage.classList.remove('dragover'));
    stage.addEventListener('drop', (e) => {
        e.preventDefault();
        stage.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) loadRomFile(file);
    });

    // ---- Fullscreen ------------------------------------------------------------------

    fullscreenButton.addEventListener('click', () => {
        if (document.fullscreenElement) {
            document.exitFullscreen();
        } else {
            stage.requestFullscreen().catch((err) => showToast(`Fullscreen failed: ${err.message}`));
        }
    });

    // ---- Top menu --------------------------------------------------------------------

    let menuTimer = null;
    const menuVisible = () => !stage.classList.contains('menu-hidden');

    function setMenuVisible(visible) {
        stage.classList.toggle('menu-hidden', !visible);
        clearTimeout(menuTimer);
        if (visible) menuTimer = setTimeout(() => setMenuVisible(false), MENU_HIDE_DELAY_MS);
    }

    // Keep the menu open while it is being used.
    menu.addEventListener('pointerdown', () => { if (menuVisible()) setMenuVisible(true); });

    // ---- Virtual gamepad -------------------------------------------------------------

    // Shown by default; a physical keyboard or gamepad press hides it, touch shows it again.
    let padVisible = true;
    function setPadVisible(visible) {
        padVisible = visible;
        stage.classList.toggle('pad-hidden', !visible);
        padToggle.classList.toggle('active', visible);
    }
    setPadVisible(true);

    padToggle.addEventListener('click', () => setPadVisible(!padVisible));

    // Each NES button can be held by several pointers at once (e.g. D-pad diagonal + B),
    // so the emulator sees a button as pressed while at least one pointer holds it.
    const holdCounts = new Map();   // button name -> number of pointers holding it
    const pointerHolds = new Map(); // pointerId -> Set of button names

    function pressButton(name) {
        const count = holdCounts.get(name) ?? 0;
        holdCounts.set(name, count + 1);
        if (count === 0) {
            setButtonHighlight(name, true);
            emulator?.set_virtual_button(VirtualButton[name], true);
        }
    }

    function releaseButton(name) {
        const count = holdCounts.get(name) ?? 0;
        if (count <= 1) {
            holdCounts.delete(name);
            setButtonHighlight(name, false);
            emulator?.set_virtual_button(VirtualButton[name], false);
        } else {
            holdCounts.set(name, count - 1);
        }
    }

    function setButtonHighlight(name, on) {
        pad.querySelectorAll(`[data-btn="${name}"]`).forEach((el) => el.classList.toggle('active', on));
    }

    // Returns the NES buttons under a point of the d-pad or a single button.
    function buttonsAt(x, y) {
        const el = document.elementFromPoint(x, y);
        if (!el) return [];
        const dpad = el.closest('.dpad');
        if (dpad) {
            // Direction from the center; a dead zone in the middle avoids accidental input.
            const rect = dpad.getBoundingClientRect();
            const dx = x - (rect.left + rect.width / 2);
            const dy = y - (rect.top + rect.height / 2);
            const deadZone = rect.width * 0.12;
            const names = [];
            if (dx < -deadZone) names.push('Left');
            if (dx > deadZone) names.push('Right');
            if (dy < -deadZone) names.push('Up');
            if (dy > deadZone) names.push('Down');
            return names;
        }
        const button = el.closest('[data-btn]');
        return button ? [button.dataset.btn] : [];
    }

    function updatePointerHolds(pointerId, names) {
        const previous = pointerHolds.get(pointerId) ?? new Set();
        const next = new Set(names);
        previous.forEach((name) => { if (!next.has(name)) releaseButton(name); });
        next.forEach((name) => { if (!previous.has(name)) pressButton(name); });
        if (next.size) pointerHolds.set(pointerId, next);
        else pointerHolds.delete(pointerId);
    }

    pad.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        pad.setPointerCapture(e.pointerId);
        updatePointerHolds(e.pointerId, buttonsAt(e.clientX, e.clientY));
    });
    pad.addEventListener('pointermove', (e) => {
        if (!pad.hasPointerCapture(e.pointerId)) return;
        updatePointerHolds(e.pointerId, buttonsAt(e.clientX, e.clientY));
    });
    const releasePointer = (e) => updatePointerHolds(e.pointerId, []);
    pad.addEventListener('pointerup', releasePointer);
    pad.addEventListener('pointercancel', releasePointer);
    pad.addEventListener('lostpointercapture', releasePointer);

    // ---- Top menu toggle and stage input ---------------------------------------------

    // Tapping or clicking the upper half toggles the menu; the pad and menu handle their own input.
    stage.addEventListener('pointerdown', (e) => {
        if (e.target.closest('#menu, #pad')) return;
        // Touching the stage means a touch device is in use: show the pad.
        if (e.pointerType === 'touch') setPadVisible(true);
        if (e.button !== 0) return;
        if (e.clientY < window.innerHeight / 2) setMenuVisible(!menuVisible());
    });

    // A real keyboard press hides the pad (isTrusted excludes synthetic events from the page).
    document.addEventListener('keydown', (e) => {
        // Browsers can resume audio on the first user gesture.
        if (emulator) emulator.resume_audio();
        if (e.isTrusted) setPadVisible(false);

        // Ctrl+O is handled by the native app's file dialog; on the web it opens the file input.
        if (e.ctrlKey && e.key === 'o') {
            e.preventDefault();
            romInput.click();
        }
    });

    // Browsers keep audio suspended until a user gesture; any click or key press starts it.
    document.addEventListener('pointerdown', () => { if (emulator) emulator.resume_audio(); });

    // Gamepad presses hide the pad too. Only a new press counts, so re-showing the pad
    // while a button is held does not hide it again.
    let gamepadWasPressed = false;
    function pollGamepads() {
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        const anyPressed = [...pads].some((gp) => gp && gp.buttons.some((b) => b.pressed));
        if (anyPressed && !gamepadWasPressed) setPadVisible(false);
        gamepadWasPressed = anyPressed;
        requestAnimationFrame(pollGamepads);
    }
    requestAnimationFrame(pollGamepads);

    // ---- Start -----------------------------------------------------------------------

    setMenuVisible(false);
    try {
        await init();
        romInput.accept = rom_file_accept();
        emulator = await start('crabby');
        showToast('Ready: open a .nes file or drop it on the screen');
    } catch (err) {
        showToast(`Failed to start: ${err}`);
        console.error(err);
    }
</script>
</body>
</html>
